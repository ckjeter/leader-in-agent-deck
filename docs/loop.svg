<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">leader on agent-deck: one dispatch loop</title>
<desc id="d">A leader session splits one task into three pieces, impl, review and research. Each piece goes as a brief through agent-deck to a different worker session: claude/opus, codex/gpt and pi/open-model. The workers send result.md back. The review result gets one follow-up and is answered again. The leader grades the results 3, 2 and 3, and each graded result becomes a row in the ledger, whose per-worker tally of count and mean grade updates.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;font-size:15px;fill:#d5dde6}
.h{font-size:14px}
.dim{fill:#8e9bab}
.cy{fill:#79c0e0}
.gr{fill:#86c98f}
.am{fill:#e0b660}
.mid{text-anchor:middle}
.end{text-anchor:end}
.pane{fill:#161d26;stroke:#2e3a47}
.bar{fill:#1f2833}
.wire{stroke:#2e3a47;stroke-dasharray:4 5;fill:none}
.brief rect{fill:#10232d;stroke:#79c0e0}
.res rect{fill:#13251a;stroke:#86c98f}
.fu rect{fill:#2b2414;stroke:#e0b660}
.stamp{transform-box:fill-box;transform-origin:center}
.off{opacity:0}

.a{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
#s0{animation-name:s0}#s1{animation-name:s1}#s2{animation-name:s2}#s3{animation-name:s3}
#s4{animation-name:s4}#s5{animation-name:s5}#s6{animation-name:s6}#s7{animation-name:s7}
#c1{animation-name:c1}#c2{animation-name:c2}#c3{animation-name:c3}
#b1{animation-name:b1}#b2{animation-name:b2}#b3{animation-name:b3}#fu{animation-name:fu}
#l1{animation-name:l1}#l2{animation-name:l2}#l3{animation-name:l3}
#i1{animation-name:i1}#i2{animation-name:i2}#i3{animation-name:i3}
#w1{animation-name:w1}#w2{animation-name:w2}#w3{animation-name:w3}
#d1{animation-name:d1}#d3{animation-name:d3}
#e2{animation-name:e2}#f2{animation-name:f2}#d2{animation-name:d2}
#r1{animation-name:r1}#r2a{animation-name:r2a}#r2{animation-name:r2}#r3{animation-name:r3}
#iss{animation-name:iss}
#g1{animation-name:g1}#g2{animation-name:g2}#g3{animation-name:g3}
#L1{animation-name:L1}#L2{animation-name:L2}#L3{animation-name:L3}
#o1{animation-name:o1}#o2{animation-name:o2}#o3{animation-name:o3}
#n1{animation-name:n1}#n2{animation-name:n2}#n3{animation-name:n3}
.tick rect{fill:#79c0e0;animation:tick .9s linear infinite}
.tick rect:nth-child(2){animation-delay:.3s}
.tick rect:nth-child(3){animation-delay:.6s}

/* leader status line, one per phase */
@keyframes s0{0%,7.4%{opacity:1}7.5%,100%{opacity:0}}
@keyframes s1{0%,7.4%{opacity:0}7.5%,16.2%{opacity:1}16.25%,100%{opacity:0}}
@keyframes s2{0%,16.2%{opacity:0}16.25%,27.4%{opacity:1}27.5%,100%{opacity:0}}
@keyframes s3{0%,27.4%{opacity:0}27.5%,43.7%{opacity:1}43.75%,100%{opacity:0}}
@keyframes s4{0%,43.7%{opacity:0}43.75%,52.4%{opacity:1}52.5%,100%{opacity:0}}
@keyframes s5{0%,52.4%{opacity:0}52.5%,68.7%{opacity:1}68.75%,100%{opacity:0}}
@keyframes s6{0%,68.7%{opacity:0}68.75%,79.9%{opacity:1}80%,100%{opacity:0}}
@keyframes s7{0%,79.9%{opacity:0}80%,100%{opacity:1}}

/* 1. split into classes: 1.2s, 1.6s, 2.0s */
@keyframes c1{0%,7.5%{opacity:0}9.375%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes c2{0%,10%{opacity:0}11.875%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes c3{0%,12.5%{opacity:0}14.375%,95.625%{opacity:1}98.75%,100%{opacity:0}}

/* 2. briefs travel through agent-deck: 2.6-3.4s, 3.0-3.8s, 3.4-4.2s */
@keyframes b1{0%,16.25%{opacity:0;transform:translate(0,0)}16.875%{opacity:1;transform:translate(0,0)}21.25%{opacity:1;transform:translate(440px,-40px)}22.5%,100%{opacity:0;transform:translate(440px,-40px)}}
@keyframes b2{0%,18.75%{opacity:0;transform:translate(0,0)}19.375%{opacity:1;transform:translate(0,0)}23.75%{opacity:1;transform:translate(440px,16px)}25%,100%{opacity:0;transform:translate(440px,16px)}}
@keyframes b3{0%,21.25%{opacity:0;transform:translate(0,0)}21.875%{opacity:1;transform:translate(0,0)}26.25%{opacity:1;transform:translate(440px,72px)}27.5%,100%{opacity:0;transform:translate(440px,72px)}}
@keyframes l1{0%,21.25%{opacity:0}22.5%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes l2{0%,23.75%{opacity:0}25%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes l3{0%,26.25%{opacity:0}27.5%,95.625%{opacity:1}98.75%,100%{opacity:0}}

/* 3. workers: idle, working, result sent; w2 gets a follow-up round */
@keyframes i1{0%,21.2%{opacity:1}21.25%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes i2{0%,23.7%{opacity:1}23.75%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes i3{0%,26.2%{opacity:1}26.25%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes w1{0%,21.2%{opacity:0}21.25%,43.7%{opacity:1}43.75%,100%{opacity:0}}
@keyframes w2{0%,23.7%{opacity:0}23.75%,46.2%{opacity:1}46.25%,100%{opacity:0}}
@keyframes w3{0%,26.2%{opacity:0}26.25%,48.7%{opacity:1}48.75%,100%{opacity:0}}
@keyframes d1{0%,43.7%{opacity:0}43.75%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes d3{0%,48.7%{opacity:0}48.75%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes e2{0%,46.2%{opacity:0}46.25%,58.7%{opacity:1}58.75%,100%{opacity:0}}
@keyframes f2{0%,58.7%{opacity:0}58.75%,63.7%{opacity:1}63.75%,100%{opacity:0}}
@keyframes d2{0%,63.7%{opacity:0}63.75%,95.625%{opacity:1}98.75%,100%{opacity:0}}
@keyframes tick{0%,100%{opacity:.25}30%{opacity:1}60%{opacity:.25}}

/* result.md cards return: r1 7.0-7.8s, r2a 7.4-8.2s, r3 7.8-8.6s, follow-up 8.6-9.4s, r2 10.2-11.0s */
@keyframes r1{0%,43.125%{opacity:0;transform:translate(440px,-14px)}43.75%{opacity:1;transform:translate(440px,-14px)}48.75%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes r2a{0%,45.625%{opacity:0;transform:translate(440px,42px)}46.25%{opacity:1;transform:translate(440px,42px)}51.25%,52.5%{opacity:1;transform:translate(0,0)}53.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes r3{0%,48.125%{opacity:0;transform:translate(440px,98px)}48.75%{opacity:1;transform:translate(440px,98px)}53.75%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes fu{0%,53.75%{opacity:0;transform:translate(0,0)}54.375%{opacity:1;transform:translate(0,0)}58.75%{opacity:1;transform:translate(440px,16px)}60%,100%{opacity:0;transform:translate(440px,16px)}}
@keyframes r2{0%,63.125%{opacity:0;transform:translate(440px,42px)}63.75%{opacity:1;transform:translate(440px,42px)}68.75%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes iss{0%,51.875%{opacity:0}52.5%,68.1%{opacity:1}68.75%,100%{opacity:0}}

/* 4. grades stamped: 11.2s, 11.6s, 12.0s */
@keyframes g1{0%,70%{opacity:0;transform:scale(1.5)}71.5625%,95.625%{opacity:1;transform:scale(1)}98.75%,100%{opacity:0;transform:scale(1)}}
@keyframes g2{0%,72.5%{opacity:0;transform:scale(1.5)}74.0625%,95.625%{opacity:1;transform:scale(1)}98.75%,100%{opacity:0;transform:scale(1)}}
@keyframes g3{0%,75%{opacity:0;transform:scale(1.5)}76.5625%,95.625%{opacity:1;transform:scale(1)}98.75%,100%{opacity:0;transform:scale(1)}}

/* 5. ledger rows drop 12.8s, 13.2s, 13.6s; tally ticks as each lands */
@keyframes L1{0%,80%{opacity:0;transform:translate(0,-22px)}82.5%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes L2{0%,82.5%{opacity:0;transform:translate(0,-22px)}85%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes L3{0%,85%{opacity:0;transform:translate(0,-22px)}87.5%,95.625%{opacity:1;transform:translate(0,0)}98.75%,100%{opacity:0;transform:translate(0,0)}}
@keyframes o1{0%,82.4%{opacity:1}82.5%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes o2{0%,84.9%{opacity:1}85%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes o3{0%,87.4%{opacity:1}87.5%,95.625%{opacity:0}98.75%,100%{opacity:1}}
@keyframes n1{0%,82.4%{opacity:0;fill:#86c98f}82.5%{opacity:1;fill:#86c98f}87.5%,95.625%{opacity:1;fill:#d5dde6}98.75%,100%{opacity:0;fill:#d5dde6}}
@keyframes n2{0%,84.9%{opacity:0;fill:#86c98f}85%{opacity:1;fill:#86c98f}90%,95.625%{opacity:1;fill:#d5dde6}98.75%,100%{opacity:0;fill:#d5dde6}}
@keyframes n3{0%,87.4%{opacity:0;fill:#86c98f}87.5%{opacity:1;fill:#86c98f}92.5%,95.625%{opacity:1;fill:#d5dde6}98.75%,100%{opacity:0;fill:#d5dde6}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

